<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>导航</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">

    <style>
        /* ============================================== */
        /* 默认主题 (浅色模式 Light Mode) */
        /* ============================================== */
        :root {
            --bg-body: #FFFFFF; /* 整体背景 */
            --bg-container: #F7F7F9; /* 侧边栏/卡片背景 */
            --bg-tertiary: #E8E8EC; /* 输入框/悬停背景 */
            --text-primary: #1d1d1f;
            --text-muted: #6a6a6a;
            --accent-color: #5d5dff;
            --shadow-base: rgba(0, 0, 0, 0.1);
            --shadow-hover: rgba(0, 0, 0, 0.2);
        }

        /* ============================================== */
        /* 强制深色模式 (Dark Mode Override) */
        /* ============================================== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #1e1e2f;
                --bg-container: #27293d;
                --bg-tertiary: #30314a;
                --text-primary: #f0f0f0;
                --text-muted: #a0a0b0;
                --shadow-base: rgba(0, 0, 0, 0.4);
                --shadow-hover: rgba(0, 0, 0, 0.6);
            }
        }

        /* 通用样式 */
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            transition: color 0.2s, background-color 0.3s, box-shadow 0.3s, transform 0.3s;
        }

        body {
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            --sidebar-width: 250px;
        }

        /* --- 1. 固定侧边栏 --- */
        .sidebar {
            width: var(--sidebar-width);
            flex-shrink: 0;
            padding: 20px 0;
            background-color: var(--bg-container);
            overflow-y: auto;
            box-shadow: 4px 0 10px var(--shadow-base);
        }

        .logo-area {
            font-size: 24px;
            font-weight: 700;
            padding: 0 20px 20px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--bg-tertiary);
        }
        .logo-area img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }

        .menu-list { list-style: none; padding: 0; }

        .menu-link {
            display: block;
            padding: 12px 20px;
            margin: 4px 10px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 15px;
            border-radius: 10px;
        }

        .menu-link:hover {
            color: var(--text-primary);
            background-color: var(--bg-tertiary);
        }
        .menu-link.active {
            color: white; /* 强调色下的文字固定为白色 */
            background-color: var(--accent-color);
            box-shadow: 0 4px 8px rgba(93, 93, 255, 0.4);
        }

        /* --- 2. 主内容区域 --- */
        .main-content-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            padding-left: 20px;
        }

        .main-content {
            padding: 0 30px 50px 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- 3. 置顶搜索栏 (玻璃效果) --- */
        .search-container {
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 20px 0;
            /* 玻璃效果，使用背景色 + 透明度 */
            background: var(--bg-body);
            background: linear-gradient(to bottom, var(--bg-body), var(--bg-body), var(--bg-body), transparent); /* 渐变让底部更柔和 */
            background-color: rgba(255, 255, 255, 0.85); /* 浅色模式下的半透明 */
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 8px var(--shadow-base);
            margin: 0 -30px;
            padding: 20px 30px;
        }

        /* 深色模式下的玻璃背景调整 */
        @media (prefers-color-scheme: dark) {
            .search-container {
                background-color: rgba(30, 30, 47, 0.85);
            }
        }

        #search-bar {
            width: 100%;
            padding: 15px 20px;
            border-radius: 12px;
            border: none;
            background-color: var(--bg-container);
            color: var(--text-primary);
            font-size: 16px;
            box-shadow: inset 0 1px 3px var(--shadow-base);
        }
        #search-bar::placeholder {
            color: var(--text-muted);
        }

        /* --- 4. 分类标题 --- */
        .category-title {
            font-size: 24px;
            font-weight: 600;
            margin-top: 40px;
            margin-bottom: 25px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
        }

        /* --- 5. 链接卡片网格 --- */
        .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .link-card {
            display: flex;
            align-items: center;
            padding: 18px;
            text-decoration: none;
            border-radius: var(--card-radius);
            background-color: var(--bg-container);
            box-shadow: 0 2px 10px var(--shadow-base);
        }

        .link-card:hover {
            background-color: var(--bg-tertiary);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px var(--shadow-hover), 0 0 10px var(--accent-color);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            background-color: var(--bg-tertiary);
            flex-shrink: 0;
        }

        .card-info { overflow: hidden; }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- 6. 底部和浮动按钮 --- */
        .footer {
            text-align: center;
            padding: 30px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .footer a { color: var(--accent-color); text-decoration: none; }

        .edit-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 20px;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(93, 93, 255, 0.5);
            z-index: 100;
        }
        .edit-button:hover { transform: scale(1.05); }

        /* 手机适配 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                width: 100%;
                height: 50px;
                padding: 0;
                order: -1; /* 移动到顶部 */
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                border-radius: 0;
                box-shadow: 0 4px 10px var(--shadow-base);
            }
            .logo-area { display: none; }
            .menu-list { display: flex; align-items: center; height: 100%; }
            .menu-link { margin: 0 5px; }

            .main-content-wrapper {
                padding-left: 0;
                margin-top: 50px; /* 为顶部导航腾出空间 */
            }
            .search-container { margin: 0 -20px; padding: 20px; }
            .main-content { padding: 0 20px 50px 20px; }
            .link-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<aside class="sidebar">
    <div class="logo-area">
        <img src="../assets/images/logos/logo-collapsed@2x.png" alt="Logo" style="vertical-align: middle;">
        MikuSugar
    </div>

    <ul class="menu-list" id="main-menu">
        <li th:each="site : ${results.sites}">
            <a href="#" class="menu-link smooth-scroll" th:attr="href='#'+ ${site.id}" th:text="${site.id}">分类名称</a>
        </li>
    </ul>
</aside>

<div class="main-content-wrapper">
    <div class="main-content">

        <div class="search-container">
            <input type="text" id="search-bar" placeholder="🔍 快速搜索网站名称或描述..." onkeyup="filterLinks()">
        </div>

        <div th:each="site : ${results.sites}">
            <h2 class="category-title" th:id="${site.id}" th:text="${site.id}">分类标题</h2>

            <div class="link-grid" th:id="'grid-' + ${site.id}">
                <a th:each="addr : ${site.siteList}"
                   th:href="${addr.address}"
                   target="_blank"
                   class="link-card search-item"
                   th:data-search="(${addr.name} + ' ' + ${addr.description})">

                    <img th:src="${addr.img}"
                         alt="icon"
                         class="card-icon"
                         loading="lazy"
                         decoding="async"
                         referrerpolicy="no-referrer"
                         onerror="this.onerror=null;this.src='../assets/images/favicon.png'">

                    <div class="card-info">
                        <div class="card-title" th:text="${addr.name}">网站名称</div>
                        <div class="card-desc" th:text="${addr.description}">这里是网站的简短描述信息...</div>
                    </div>
                </a>
            </div>
        </div>

        <footer class="footer">
            <p id="footer-text"></p>
        </footer>
    </div>
</div>

<a href="https://github.com/MikuSugar/SugarHome/edit/master/src/main/resources/in.json" target="_blank" class="edit-button">
    编辑数据
</a>

<script>
    // 1. 设置页脚年份
    document.getElementById('footer-text').innerHTML = `&copy; ${new Date().getFullYear()} <a href='https://mikusugar.me/' target='_blank'>追赶风车</a> powered by <a href='https://github.com/WebStackPage/WebStackPage.github.io' target='_blank'>WebStack</a>`;

    // 2. 平滑滚动和侧边栏高亮 (Native JS)
    const mainContentWrapper = document.querySelector('.main-content-wrapper');
    const links = document.querySelectorAll('.smooth-scroll');

    // 平滑跳转
    links.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            document.querySelectorAll('.menu-link').forEach(l => l.classList.remove('active'));
            this.classList.add('active');

            const targetId = this.getAttribute('href');
            const targetElement = document.querySelector(targetId);
            const searchHeight = document.querySelector('.search-container').offsetHeight;
            const offset = targetElement.offsetTop - searchHeight - 20;

            // 确保在滚动到内容区
            mainContentWrapper.scrollTo({
                top: offset,
                behavior: 'smooth'
            });

            // 手机端点击后隐藏侧边栏（如果实现的话）
            if (window.innerWidth <= 768) {
                // 这里可以添加逻辑来关闭手机端的导航菜单
            }
        });
    });

    // 3. 实时搜索过滤 (核心便利性功能)
    function filterLinks() {
        const query = document.getElementById('search-bar').value.toLowerCase();
        const items = document.querySelectorAll('.search-item');

        items.forEach(item => {
            const searchData = item.getAttribute('data-search').toLowerCase();
            const categoryElement = item.closest('.link-grid').previousElementSibling; // 获取父分类标题

            if (searchData.includes(query) || query === '') {
                item.style.display = 'flex';
            } else {
                item.style.display = 'none';
            }
        });

        // 隐藏空的分类标题
        document.querySelectorAll('.link-grid').forEach(grid => {
            const visibleCards = Array.from(grid.children).some(card => card.style.display !== 'none');
            const title = grid.previousElementSibling;
            if (title && title.classList.contains('category-title')) {
                title.style.display = visibleCards ? 'flex' : 'none';
            }
        });
    }

    // 4. 首次加载时自动高亮第一个菜单项
    document.addEventListener('DOMContentLoaded', () => {
        const firstLink = document.querySelector('.menu-link');
        if (firstLink) {
            firstLink.classList.add('active');
        }
    });
</script>
</body>
</html>
